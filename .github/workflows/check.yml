name: NDS checks
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 4
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.21.0'
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - id: protocol
        run: |
          python - <<'PY'
          import os,re,tomllib
          from pathlib import Path
          lock=tomllib.loads(Path('protocol.lock').read_text())
          assert lock['source_repo']=='NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-protocol'
          assert re.fullmatch('[a-f0-9]{40}',lock['source_commit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+lock['source_commit']+'\n')
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-protocol
          ref: ${{ steps.protocol.outputs.sha }}
          path: vendor/protocol
          persist-credentials: false
      - run: python scripts/generate.py --check
        env:
          NDS_PROTOCOL_SOURCE: ${{ github.workspace }}/vendor/protocol
      - run: cargo install --locked --version 0.9.148 cargo-nextest
      - run: cargo nextest run --locked --all-features
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo install --locked --version 0.20.2 cargo-deny
      - run: cargo audit --deny warnings
      - run: cargo deny --locked check licenses sources
  quality:
    if: always()
    needs: [rust, contracts]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.rust.result }}' = success && test '${{ needs.contracts.result }}' = success
