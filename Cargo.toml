[package]
name = "nddev-device-sync-accounts"
version = "0.0.1-alpha.16"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts"

[features]
default = []
development-http = []

[dependencies]
nddev-device-sync-http-signatures = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-protocol.git", rev = "3e5cbe56a3a810e3b7c7f16f0dc1f67a63ab1ac2" }
base64 = "0.22"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
ring = "0.17"
keyring-core = "1.0.0"
nddev-device-sync-domain = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-core.git", rev = "d08e6b34c9ff6af1fdc179291f5386ec73c84926" }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-observability", rev = "ff6d0ff149712c39b90a5d4d89e2768ab2e6db5a", features = ["client-traces"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
url = "2.5"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
jni = "0.22.4"
jni-legacy = { package = "jni", version = "0.21.1" }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
uuid = { version = "1.27", features = ["v4", "v7"] }
