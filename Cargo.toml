[package]
name = "nddev-device-sync-accounts"
version = "0.0.1-alpha.18"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts"

[features]
default = []
development-http = []

[dependencies]
http = "1"
nddev-device-sync-http-signatures = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-protocol.git", rev = "2d02bfca16266e7c343b024807362c7cbbf8f7c6" }
base64 = "0.22"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
ring = "0.17"
nddev-device-sync-domain = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-core.git", rev = "d5d16cc3f59aa879136c40d160e756d70c87b5da" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1.53", features = ["sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-observability", rev = "77e7e3ece9ac5aff400ce7a0880e52503b5ee41c", features = ["client-traces"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
url = "2.5"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
jni = "0.22.4"
jni-legacy = { package = "jni", version = "0.21.1" }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
futures = "0.3"
uuid = { version = "1.27", features = ["v4", "v7"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = {version="0.17", features=["wasm32_unknown_unknown_js"]}
time = {version="0.3", features=["wasm-bindgen"]}
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-time = "1.1"
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }
keyring-core = "1.0.0"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["libsqlite3-sys", "bundled", "fallible_uint"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
